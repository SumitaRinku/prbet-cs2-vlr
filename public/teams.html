<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>队伍中心 - PRBET</title>
    <link rel="icon" type="image/png" href="/images/prbetlogo_square.png">
    <link rel="apple-touch-icon" href="/images/prbetlogo_square.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/hub.css">
    <!-- 主题脚本置于 head 内同步执行：首帧渲染前写入 data-theme，避免暗色模式下页面闪白 -->
    <script src="/js/theme.js"></script>
</head>
<body>
    <header class="hero compact">
        <nav>
            <a class="brand-logo" href="/" aria-label="PRBET 首页"><img src="/images/prbetlogo.png" alt="PRBET"></a>
            <div class="site-nav">
                <a href="/">比赛竞猜</a>
                <a href="/tournaments.html">赛事回看</a>
                <a class="active" href="/teams.html">队伍中心</a>
                <a href="/leaderboard.html">排行榜</a>
                <a href="/profile.html">个人中心</a>
            </div>
            <div id="userPanel"></div>
        </nav>
        <section>
            <p class="eyebrow">Team Hub</p>
            <h1>队伍中心</h1>
            <p>查看队伍近期战绩、下一场比赛与赛事履历。</p>
        </section>
    </header>

    <main class="page-shell th-page">
        <section id="teamListView">
            <div class="th-bar">
                <label class="th-search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 1 0 4.55 13.45l4.25 4.25 1.4-1.4-4.25-4.25A7.5 7.5 0 0 0 10.5 3Zm0 2a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z" fill="currentColor"/></svg>
                    <input id="teamSearch" type="search" placeholder="搜索队伍名称或简称" aria-label="搜索队伍" autocomplete="off">
                </label>
                <div id="teamGameSeg" class="th-seg" role="group" aria-label="游戏类型">
                    <button type="button" data-game="cs2">CS2</button>
                    <button type="button" data-game="valorant">Valorant</button>
                    <button type="button" data-game="">全部</button>
                </div>
                <div class="th-selects">
                    <label>排序
                        <select id="teamSort" aria-label="排序方式">
                            <option value="recent">最近活跃</option>
                            <option value="wins">胜场最多</option>
                            <option value="played">已赛最多</option>
                            <option value="name">名称 A-Z</option>
                        </select>
                    </label>
                    <label>范围
                        <select id="teamActivity" aria-label="队伍范围">
                            <option value="">全部队伍</option>
                            <option value="active">有比赛记录</option>
                            <option value="upcoming">有待赛比赛</option>
                        </select>
                    </label>
                </div>
                <span id="teamCount" class="th-count"></span>
            </div>
            <div id="teamsGrid" class="th-grid"><div class="th-loading">加载队伍中...</div></div>
        </section>
        <section id="teamDetailView" class="th-detail" hidden></section>
    </main>

    <footer class="site-footer"><div class="icp-info">{{BEIAN}}</div></footer>
    <script src="/js/tournament-logos.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/teams.js"></script>
</body>
</html>
