<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PRBET 比赛竞猜</title>
    <link rel="icon" type="image/png" href="/images/prbetlogo_square.png">
    <link rel="apple-touch-icon" href="/images/prbetlogo_square.png">
    <link rel="stylesheet" href="/css/style.css">
    <!-- 主题脚本置于 head 内同步执行：首帧渲染前写入 data-theme，避免暗色模式下页面闪白 -->
    <script src="/js/theme.js"></script>
</head>
<body>
    <header class="hero">
        <nav>
            <a class="brand-logo" href="/" aria-label="PRBET 首页"><img src="/images/prbetlogo.png" alt="PRBET"></a>
            <div class="site-nav">
                <a class="active" href="/">比赛竞猜</a>
                <a href="/tournaments.html">赛事回看</a>
                <a href="/teams.html">队伍中心</a>
                <a href="/leaderboard.html">排行榜</a>
                <a href="/profile.html">个人中心</a>
            </div>
            <div id="userPanel"></div>
        </nav>
        <section>
            <h1>比赛竞猜</h1>
            <p>按状态和赛事快速找到目标比赛。</p>
        </section>
    </header>

    <main class="layout home-layout">
        <section class="maincol">
            <section class="home-match-browser" aria-label="比赛筛选">
                <div class="home-browser-head">
                    <div>
                        <h2>比赛与赛事</h2>
                        <p id="matchFilterSummary">按状态和赛事筛选比赛。</p>
                    </div>
                    <div class="game-switch" id="gameSwitch" role="tablist" aria-label="筛选游戏">
                        <button type="button" role="tab" data-game="cs2">CS2</button>
                        <button type="button" role="tab" data-game="valorant">Valorant</button>
                        <button type="button" role="tab" data-game="">全部</button>
                    </div>
                </div>
                <div id="statusFilters" class="match-status-tabs" role="group" aria-label="比赛状态"></div>
                <div class="home-tournament-filter">
                    <div class="filter-label"><strong>赛事</strong></div>
                    <div id="tournamentFilters" class="tournament-filter-list"></div>
                    <select id="tournamentFilter" aria-label="筛选赛事" onchange="setTournament(this.value)">
                        <option value="">全部赛事</option>
                    </select>
                </div>
            </section>
            <div class="match-results-head">
                <div><h2 id="matchResultsTitle">全部比赛</h2><p id="matchResultsMeta"></p></div>
                <div class="match-results-actions">
                    <button id="clearMatchFilters" class="button ghost" type="button" onclick="clearMatchFilters()" hidden>清除筛选</button>
                </div>
            </div>
            <div id="homeBracket" class="home-bracket" hidden></div>
            <div id="matches" class="grid"></div>
        </section>
    </main>

    <div id="detailModal" class="modal" hidden>
        <div class="modal-backdrop" onclick="closeDetailModal()"></div>
        <section class="modal-panel">
            <button class="modal-close" onclick="closeDetailModal()">×</button>
            <div id="detailModalBody"></div>
        </section>
    </div>

    <footer class="site-footer">
        <div class="footer-links">
            <a href="https://github.com/SumitaRinku/prbet-cs2-vlr" target="_blank" rel="noopener noreferrer" title="GitHub 仓库">
                <svg viewBox="0 0 16 16" aria-hidden="true" width="14" height="14" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
                <span>GitHub</span>
            </a>
        </div>
        <div class="icp-info">
            {{BEIAN}}
        </div>
    </footer>

    <script src="/js/tournament-logos.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/h2h.js"></script>
    <script src="/js/share.js"></script>
    <script src="/js/bracket.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
