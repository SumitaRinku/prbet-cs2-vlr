<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PRBET 比赛竞猜</title>
    <link rel="icon" type="image/png" href="/images/prbetlogo_square.png">
    <link rel="apple-touch-icon" href="/images/prbetlogo_square.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="hero">
        <nav>
            <a class="brand-logo" href="/" aria-label="PRBET 首页"><img src="/images/prbetlogo.png" alt="PRBET"></a>
            <div class="site-nav">
                <a class="active" href="/">比赛竞猜</a>
                <a href="/tournaments.html">赛事回看</a>
                <a href="/leaderboard.html">排行榜</a>
                <a href="/profile.html">个人中心</a>
            </div>
            <div id="userPanel"></div>
        </nav>
        <section>
            <p class="eyebrow">Matches</p>
            <h1>比赛竞猜</h1>
            <p>查看近期赛程，选择你看好的胜者和比分。</p>
        </section>
    </header>

    <main class="layout home-layout">
        <section class="maincol">
            <div class="section-head">
                <h2>比赛列表</h2>
                <select id="gameFilter" onchange="setGame(this.value)">
                    <option value="cs2">CS2</option>
                    <option value="valorant">Valorant</option>
                    <option value="">全部游戏</option>
                </select>
                <select id="tournamentFilter" onchange="setTournament(this.value)">
                    <option value="">全部赛事</option>
                </select>
            </div>
            <div id="homeBracket" class="home-bracket" hidden></div>
            <div id="matches" class="grid"></div>
        </section>
    </main>

    <div id="detailModal" class="modal" hidden>
        <div class="modal-backdrop" onclick="closeDetailModal()"></div>
        <section class="modal-panel">
            <button class="modal-close" onclick="closeDetailModal()">×</button>
            <div id="detailModalBody"></div>
        </section>
    </div>

    <footer class="site-footer">
        <div class="icp-info">
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">豫ICP备XXXXXXXX号</a>
        </div>
    </footer>

    <script src="/js/bracket.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
