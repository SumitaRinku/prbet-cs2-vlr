<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PRBET 比赛竞猜</title>
    <link rel="icon" type="image/png" href="/images/prbetlogo_square.png">
    <link rel="apple-touch-icon" href="/images/prbetlogo_square.png">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="hero">
        <nav>
            <a class="brand-logo" href="/" aria-label="PRBET 首页"><img src="/images/prbetlogo.png" alt="PRBET"></a>
            <div class="site-nav">
                <a class="active" href="/">比赛竞猜</a>
                <a href="/tournaments.html">赛事回看</a>
                <a href="/teams.html">队伍中心</a>
                <a href="/leaderboard.html">排行榜</a>
                <a href="/profile.html">个人中心</a>
            </div>
            <div id="userPanel"></div>
        </nav>
        <section>
            <h1>比赛竞猜</h1>
            <p>按状态和赛事快速找到目标比赛。</p>
        </section>
    </header>

    <main class="layout home-layout">
        <section class="maincol">
            <section class="home-match-browser" aria-label="比赛筛选">
                <div class="home-browser-head">
                    <div>
                        <h2>比赛与赛事</h2>
                        <p id="matchFilterSummary">按状态和赛事筛选比赛。</p>
                    </div>
                    <select id="gameFilter" aria-label="筛选游戏" onchange="setGame(this.value)">
                        <option value="cs2">CS2</option>
                        <option value="valorant">Valorant</option>
                        <option value="">全部游戏</option>
                    </select>
                </div>
                <div id="statusFilters" class="match-status-tabs" role="group" aria-label="比赛状态"></div>
                <div class="home-tournament-filter">
                    <div class="filter-label"><strong>赛事</strong></div>
                    <div id="tournamentFilters" class="tournament-filter-list"></div>
                    <select id="tournamentFilter" aria-label="筛选赛事" onchange="setTournament(this.value)">
                        <option value="">全部赛事</option>
                    </select>
                </div>
            </section>
            <div class="match-results-head">
                <div><h2 id="matchResultsTitle">全部比赛</h2><p id="matchResultsMeta"></p></div>
                <button id="clearMatchFilters" class="button ghost" type="button" onclick="clearMatchFilters()" hidden>清除筛选</button>
            </div>
            <div id="homeBracket" class="home-bracket" hidden></div>
            <div id="matches" class="grid"></div>
        </section>
    </main>

    <div id="detailModal" class="modal" hidden>
        <div class="modal-backdrop" onclick="closeDetailModal()"></div>
        <section class="modal-panel">
            <button class="modal-close" onclick="closeDetailModal()">×</button>
            <div id="detailModalBody"></div>
        </section>
    </div>

    <footer class="site-footer">
        <div class="icp-info">
            {{BEIAN}}
        </div>
    </footer>

    <script src="/js/bracket.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
