<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理后台 - PRBET</title>
    <link rel="icon" type="image/png" href="/images/prbetlogo_square.png">
    <link rel="apple-touch-icon" href="/images/prbetlogo_square.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <!-- 主题脚本置于 head 内同步执行：首帧渲染前写入 data-theme，避免暗色模式下页面闪白 -->
    <script src="/js/theme.js"></script>
</head>
<body class="ops-body">
    <header class="hero compact">
        <nav>
            <a class="brand-logo" href="/" aria-label="PRBET 首页"><img src="/images/prbetlogo.png" alt="PRBET"></a>
            <div class="site-nav">
                <a href="/">比赛竞猜</a>
                <a href="/tournaments.html">赛事回看</a>
                <a href="/teams.html">队伍中心</a>
                <a href="/leaderboard.html">排行榜</a>
                <a class="active" href="/admin/">管理后台</a>
            </div>
            <div id="auth"></div>
        </nav>
    </header>

    <main class="ops-shell">
        <!-- 未登录 / 非管理员时显示 -->
        <section id="opsGate" class="ops-gate" hidden></section>

        <div id="opsApp" class="ops-app" hidden>
            <aside class="ops-side">
                <div class="ops-side-head">
                    <p class="eyebrow">Admin Console</p>
                    <h2>管理后台</h2>
                </div>
                <nav class="ops-nav" id="opsNav" aria-label="后台导航">
                    <button type="button" data-tab="overview">概览</button>
                    <button type="button" data-tab="matches">比赛<b data-count="matches"></b></button>
                    <button type="button" data-tab="tournaments">赛事<b data-count="tournaments"></b></button>
                    <button type="button" data-tab="teams">队伍<b data-count="teams"></b></button>
                    <button type="button" data-tab="users">用户<b data-count="users"></b></button>
                    <button type="button" data-tab="predictions">预测记录<b data-count="predictions"></b></button>
                </nav>
                <div class="ops-side-foot">
                    <span class="ops-side-label">游戏</span>
                    <div id="opsGameSeg" class="ops-seg" role="group" aria-label="游戏筛选">
                        <button type="button" data-game="">全部</button>
                        <button type="button" data-game="cs2">CS2</button>
                        <button type="button" data-game="valorant">VAL</button>
                    </div>
                </div>
            </aside>

            <div class="ops-main">
                <!-- 同步状态条：所有页签共享 -->
                <div class="ops-syncbar">
                    <span id="opsSyncBadge" class="ops-badge">读取中…</span>
                    <span id="opsSyncInfo" class="ops-sync-info"></span>
                    <label class="ops-preview-field" title="未来赛事预告的前瞻天数（只拉取赛事，不导入远期比赛）">
                        预告前瞻
                        <input id="opsPreviewDays" type="number" min="7" max="365" step="1" inputmode="numeric" aria-label="赛事预告前瞻天数">天
                    </label>
                    <button type="button" class="ops-btn ghost" data-act="save-preview-days" title="保存预告前瞻天数">保存</button>
                    <button type="button" class="ops-btn ghost" data-act="sync-previews" title="立即刷新远期赛事预告">刷新预告</button>
                    <button type="button" id="opsSyncBtn" class="ops-btn">同步赛事数据</button>
                    <button type="button" id="opsReloadBtn" class="ops-btn ghost" title="重新加载后台数据">刷新</button>
                </div>
                <div id="opsView"></div>
            </div>
        </div>
    </main>

    <!-- 通用对话框：表单编辑与二次确认共用 -->
    <div id="opsModal" class="modal ops-modal" hidden>
        <div class="modal-backdrop" data-close></div>
        <section class="modal-panel ops-modal-panel" role="dialog" aria-modal="true" aria-labelledby="opsModalTitle">
            <header class="ops-modal-head">
                <div><h2 id="opsModalTitle"></h2><p id="opsModalHint"></p></div>
                <button type="button" class="ops-icon-btn" data-close aria-label="关闭">×</button>
            </header>
            <form id="opsModalForm" class="ops-modal-body" novalidate></form>
            <p id="opsModalError" class="ops-modal-error" hidden></p>
            <footer class="ops-modal-foot">
                <button type="button" class="ops-btn ghost" data-close>取消</button>
                <button type="submit" form="opsModalForm" id="opsModalSubmit" class="ops-btn">保存</button>
            </footer>
        </section>
    </div>

    <div id="opsToasts" class="ops-toasts" aria-live="polite"></div>

    <footer class="site-footer">
        <div class="icp-info">
            {{BEIAN}}
        </div>
    </footer>

    <script src="/js/tournament-logos.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
