<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理后台 - PRBET</title>
    <link rel="icon" type="image/png" href="/images/prbetlogo_square.png">
    <link rel="apple-touch-icon" href="/images/prbetlogo_square.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
    <!-- 主题脚本置于 head 内同步执行：首帧渲染前写入 data-theme，避免暗色模式下页面闪白 -->
    <script src="/js/theme.js"></script>
</head>
<body class="ad-body">
    <header class="hero compact">
        <nav>
            <a class="brand-logo" href="/" aria-label="PRBET 首页"><img src="/images/prbetlogo.png" alt="PRBET"></a>
            <div class="site-nav">
                <a href="/">比赛竞猜</a>
                <a href="/tournaments.html">赛事回看</a>
                <a href="/teams.html">队伍中心</a>
                <a href="/leaderboard.html">排行榜</a>
                <a class="active" href="/admin/">管理后台</a>
            </div>
            <div id="auth"></div>
        </nav>
    </header>

    <main class="ad-shell">
        <!-- 未登录 / 非管理员时显示 -->
        <section id="adGate" class="ad-gate" hidden></section>

        <div id="adApp" class="ad-app" hidden>
            <aside class="ad-side">
                <div class="ad-side-head">
                    <p class="eyebrow">Admin Console</p>
                    <h2>管理后台</h2>
                </div>
                <nav class="ad-nav" id="adNav" aria-label="后台导航">
                    <button type="button" data-tab="overview">概览</button>
                    <button type="button" data-tab="matches">比赛<b data-count="matches"></b></button>
                    <button type="button" data-tab="tournaments">赛事<b data-count="tournaments"></b></button>
                    <button type="button" data-tab="teams">队伍<b data-count="teams"></b></button>
                    <button type="button" data-tab="users">用户<b data-count="users"></b></button>
                    <button type="button" data-tab="predictions">预测记录<b data-count="predictions"></b></button>
                </nav>
                <div class="ad-side-foot">
                    <span class="ad-side-label">游戏</span>
                    <div id="adGameSeg" class="ad-seg" role="group" aria-label="游戏筛选">
                        <button type="button" data-game="">全部</button>
                        <button type="button" data-game="cs2">CS2</button>
                        <button type="button" data-game="valorant">VAL</button>
                    </div>
                </div>
            </aside>

            <div class="ad-main">
                <!-- 同步状态条：所有页签共享 -->
                <div class="ad-syncbar">
                    <span id="adSyncBadge" class="ad-badge">读取中…</span>
                    <span id="adSyncInfo" class="ad-sync-info"></span>
                    <button type="button" id="adSyncBtn" class="ad-btn">同步赛事数据</button>
                    <button type="button" id="adReloadBtn" class="ad-btn ghost" title="重新加载后台数据">刷新</button>
                </div>
                <div id="adView"></div>
            </div>
        </div>
    </main>

    <!-- 通用对话框：表单编辑与二次确认共用 -->
    <div id="adModal" class="modal ad-modal" hidden>
        <div class="modal-backdrop" data-close></div>
        <section class="modal-panel ad-modal-panel" role="dialog" aria-modal="true" aria-labelledby="adModalTitle">
            <header class="ad-modal-head">
                <div><h2 id="adModalTitle"></h2><p id="adModalHint"></p></div>
                <button type="button" class="ad-icon-btn" data-close aria-label="关闭">×</button>
            </header>
            <form id="adModalForm" class="ad-modal-body" novalidate></form>
            <p id="adModalError" class="ad-modal-error" hidden></p>
            <footer class="ad-modal-foot">
                <button type="button" class="ad-btn ghost" data-close>取消</button>
                <button type="submit" form="adModalForm" id="adModalSubmit" class="ad-btn">保存</button>
            </footer>
        </section>
    </div>

    <div id="adToasts" class="ad-toasts" aria-live="polite"></div>

    <footer class="site-footer">
        <div class="icp-info">
            {{BEIAN}}
        </div>
    </footer>

    <script src="/js/tournament-logos.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
