<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>个人中心 - PRBET</title>
    <link rel="icon" type="image/png" href="/images/prbetlogo_square.png">
    <link rel="apple-touch-icon" type="image/png" href="/images/prbetlogo_square.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/profile.css">
    <!-- 主题脚本置于 head 内同步执行：首帧渲染前写入 data-theme，避免暗色模式下页面闪白 -->
    <script src="/js/theme.js"></script>
</head>
<body>
    <header class="hero compact">
        <nav>
            <a class="brand-logo" href="/" aria-label="PRBET 首页"><img src="/images/prbetlogo.png" alt="PRBET"></a>
            <div class="site-nav">
                <a href="/">比赛竞猜</a>
                <a href="/tournaments.html">赛事回看</a>
                <a href="/teams.html">队伍中心</a>
                <a href="/leaderboard.html">排行榜</a>
                <a class="active" href="/profile.html">个人中心</a>
            </div>
            <div id="userPanel"></div>
        </nav>
        <section>
            <p class="eyebrow">Profile</p>
            <h1>个人中心</h1>
            <p>查看你的竞猜统计、历史预测、赛果和得分情况。</p>
        </section>
    </header>

    <main class="page-shell pc-page">
        <section id="loginRequired" class="pc-empty pc-login" hidden>
            <h3>请先登录</h3>
            <p>在页面顶部登录后，可查看自己的全部预测记录与积分统计。</p>
        </section>

        <section id="profileContent" class="pc-content" hidden>
            <!-- 概览：身份 + 核心统计 + 近期状态 -->
            <section id="profileHero" class="pc-hero" aria-label="账号概览"></section>

            <!-- 标签页：状态同步到 URL hash，刷新不丢失 -->
            <div class="pc-tabs" role="tablist" aria-label="个人中心分区">
                <button type="button" role="tab" id="tabRecords" aria-controls="profileTabRecords" data-profile-tab="records" onclick="setProfileTab('records')">我的预测</button>
                <button type="button" role="tab" id="tabSettings" aria-controls="profileTabSettings" data-profile-tab="settings" onclick="setProfileTab('settings')">账号设置</button>
            </div>

            <section class="pc-panel" id="profileTabRecords" role="tabpanel" aria-labelledby="tabRecords">
                <div class="pc-toolbar">
                    <div id="pfChips" class="pc-chips" role="group" aria-label="按状态筛选"></div>
                    <div class="pc-selects">
                        <select id="pfGame" onchange="setProfileGame(this.value)" aria-label="按游戏筛选"></select>
                        <select id="pfTournament" onchange="setProfileTournament(this.value)" aria-label="按赛事筛选"></select>
                        <span id="recordCount" class="pc-count" aria-live="polite"></span>
                    </div>
                </div>
                <div id="predictionList" class="pc-list"></div>
            </section>

            <section class="pc-settings" id="profileTabSettings" role="tabpanel" aria-labelledby="tabSettings" hidden>
                <article class="pc-card">
                    <header><h2>QQ 群竞猜绑定</h2><p>绑定后可在启用功能的群内提交或修改竞猜，赛后群内会展示你的竞猜结果。</p></header>
                    <p id="botBindingFeedback" class="pc-status" role="status"></p>
                    <form id="botBindingForm" class="pc-form pc-form-inline">
                        <label class="pc-field">
                            <span>QQ 号</span>
                            <input id="botBindingQQ" type="text" inputmode="numeric" pattern="[1-9][0-9]{4,15}" required placeholder="你的 QQ 号" autocomplete="off">
                        </label>
                        <div class="pc-actions">
                            <button type="submit">生成绑定码</button>
                            <button type="button" id="botUnbind" class="ghost">解除绑定</button>
                        </div>
                    </form>
                </article>

                <article class="pc-card">
                    <header><h2>修改密码</h2><p>修改后当前页面自动换用新的登录凭据，其他设备需重新登录。</p></header>
                    <form id="passwordForm" class="pc-form" autocomplete="off">
                        <label class="pc-field">
                            <span>原密码</span>
                            <input id="oldPassword" type="password" autocomplete="current-password" required>
                        </label>
                        <label class="pc-field">
                            <span>新密码</span>
                            <input id="newPassword" type="password" autocomplete="new-password" minlength="6" placeholder="至少 6 位" required>
                        </label>
                        <label class="pc-field">
                            <span>确认新密码</span>
                            <input id="newPasswordConfirm" type="password" autocomplete="new-password" minlength="6" required>
                        </label>
                        <div class="pc-actions"><button type="submit">保存新密码</button></div>
                    </form>
                    <p id="pfFeedback" class="pc-feedback" role="status" hidden></p>
                </article>

                <!-- 管理员专属：排行榜默认隐藏管理员数据，可自愿公开 -->
                <article id="visibilitySection" class="pc-card" hidden>
                    <header><h2>数据公开</h2></header>
                    <label class="pc-switch">
                        <input type="checkbox" id="visibilityToggle" onchange="togglePredictionsPublic(this.checked)">
                        <span class="pc-switch-track" aria-hidden="true"></span>
                        <span class="pc-switch-text">
                            <strong>在排行榜公开我的预测数据</strong>
                            <small>关闭时排行榜不展示你的成绩；开启后与普通用户一同参与排名（含赛事榜和 CSV 导出）。</small>
                        </span>
                    </label>
                    <p id="visibilityFeedback" class="pc-feedback" role="status" hidden></p>
                </article>
            </section>
        </section>
    </main>

    <footer class="site-footer">
        <div class="icp-info">
            {{BEIAN}}
        </div>
    </footer>

    <script src="/js/tournament-logos.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/share.js"></script>
    <script src="/js/profile.js"></script>
    <script src="/js/bot-account.js"></script>
</body>
</html>
