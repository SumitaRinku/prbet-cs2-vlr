<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>个人中心 - PRBET</title>
    <link rel="icon" type="image/png" href="/images/prbetlogo_square.png">
    <link rel="apple-touch-icon" type="image/png" href="/images/prbetlogo_square.png">
    <link rel="stylesheet" href="/css/style.css">
    <!-- 主题脚本置于 head 内同步执行：首帧渲染前写入 data-theme，避免暗色模式下页面闪白 -->
    <script src="/js/theme.js"></script>
</head>
<body>
    <header class="hero compact">
        <nav>
            <a class="brand-logo" href="/" aria-label="PRBET 首页"><img src="/images/prbetlogo.png" alt="PRBET"></a>
            <div class="site-nav">
                <a href="/">比赛竞猜</a>
                <a href="/tournaments.html">赛事回看</a>
                <a href="/teams.html">队伍中心</a>
                <a href="/leaderboard.html">排行榜</a>
                <a class="active" href="/profile.html">个人中心</a>
            </div>
            <div id="userPanel"></div>
        </nav>
        <section>
            <p class="eyebrow">Profile</p>
            <h1>个人中心</h1>
            <p>查看你的竞猜统计、历史预测、赛果和得分情况。</p>
        </section>
    </header>

    <main class="page-shell profile-page">
        <section id="loginRequired" class="panel empty-state" hidden>
            <h3>请先登录</h3>
            <p>登录后可以查看自己的全部预测记录和积分统计。</p>
        </section>

        <section id="profileContent" hidden>
            <!-- 概览头部：头像 + 身份 + 账号积分 + 核心统计 -->
            <section class="profile-hero panel" id="profileHero"></section>

            <!-- 标签页：预测记录 / 账号设置（状态同步到 URL hash，刷新不丢失） -->
            <div class="profile-tabs" role="tablist" aria-label="个人中心分区">
                <button type="button" role="tab" data-profile-tab="records" onclick="setProfileTab('records')">我的预测</button>
                <button type="button" role="tab" data-profile-tab="settings" onclick="setProfileTab('settings')">账号设置</button>
            </div>

            <section class="panel profile-tab-panel" id="profileTabRecords" role="tabpanel">
                <div class="section-head">
                    <h2>预测记录</h2>
                    <span id="recordCount" class="profile-record-count"></span>
                </div>
                <div class="pf-toolbar">
                    <div id="pfChips" class="pf-chip-list" aria-label="按状态筛选"></div>
                    <div class="pf-select-row">
                        <select id="pfGame" onchange="setProfileGame(this.value)" aria-label="按游戏筛选"></select>
                        <select id="pfTournament" onchange="setProfileTournament(this.value)" aria-label="按赛事筛选"></select>
                        <div class="pf-view-toggle" role="group" aria-label="视图切换">
                            <button type="button" data-pf-view="compact" onclick="setProfileView('compact')">紧凑</button>
                            <button type="button" data-pf-view="cards" onclick="setProfileView('cards')">详细</button>
                        </div>
                    </div>
                </div>
                <div id="predictionList" class="pf-compact-list"></div>
            </section>

            <section class="panel profile-tab-panel" id="profileTabSettings" role="tabpanel" hidden>
                <div class="section-head"><h2>修改密码</h2></div>
                <form id="passwordForm" class="pf-form" autocomplete="off">
                    <input id="oldPassword" type="password" placeholder="原密码" autocomplete="current-password">
                    <input id="newPassword" type="password" placeholder="新密码（至少6位）" autocomplete="new-password">
                    <input id="newPasswordConfirm" type="password" placeholder="确认新密码" autocomplete="new-password">
                    <button type="submit">保存新密码</button>
                </form>
                <p id="pfFeedback" class="pf-feedback" hidden></p>

                <!-- 管理员专属：排行榜默认隐藏管理员数据，可自愿公开 -->
                <div id="visibilitySection" class="pf-visibility" hidden>
                    <div class="section-head"><h2>数据公开</h2></div>
                    <label class="pf-switch-row">
                        <input type="checkbox" id="visibilityToggle" onchange="togglePredictionsPublic(this.checked)">
                        <span class="pf-switch-text">
                            <strong>在排行榜公开我的预测数据</strong>
                            <small>关闭时排行榜不展示你的成绩；开启后与普通用户一同参与排名（含赛事榜和 CSV 导出）。</small>
                        </span>
                    </label>
                    <p id="visibilityFeedback" class="pf-feedback" hidden></p>
                </div>
            </section>
        </section>
    </main>

    <footer class="site-footer">
        <div class="icp-info">
            {{BEIAN}}
        </div>
    </footer>

    <script src="/js/tournament-logos.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/share.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
