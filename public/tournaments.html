<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>赛事回看 - PRG 竞猜</title>
    <link rel="icon" type="image/png" href="/images/prbetlogo_square.png">
    <link rel="apple-touch-icon" href="/images/prbetlogo_square.png">
    <link rel="stylesheet" href="/css/style.css">
    <!-- 主题脚本置于 head 内同步执行：首帧渲染前写入 data-theme，避免暗色模式下页面闪白 -->
    <script src="/js/theme.js"></script>
</head>
<body>
    <header class="hero compact">
        <nav>
            <a class="brand-logo" href="/" aria-label="PRBET 首页"><img src="/images/prbetlogo.png" alt="PRBET"></a>
            <div class="site-nav">
                <a href="/">比赛竞猜</a>
                <a class="active" href="/tournaments.html">赛事回看</a>
                <a href="/teams.html">队伍中心</a>
                <a href="/leaderboard.html">排行榜</a>
                <a href="/profile.html">个人中心</a>
            </div>
            <div id="userPanel"></div>
        </nav>
        <section>
            <h1>赛事回看</h1>
            <p>赛事进度、赛果与预测统计。</p>
        </section>
    </header>

    <main class="page-shell tournament-archive-page">
        <div class="filters-bar panel">
            <strong>筛选赛事</strong>
            <select id="gameFilter" onchange="setGame(this.value)">
                <option value="cs2">CS2</option>
                <option value="valorant">Valorant</option>
                <option value="">全部游戏</option>
            </select>
            <select id="statusFilter" onchange="loadTournaments()">
                <option value="">全部赛事</option>
                <option value="ongoing">进行中</option>
                <option value="finished">已结束</option>
            </select>
            <select id="tierFilter" onchange="setTier(this.value)">
                <option value="">全部级别</option>
                <option value="1">高级</option>
                <option value="2">普通</option>
                <option value="3">低级</option>
            </select>
            <span id="tournamentCount" class="filter-result-count"></span>
            <div id="brandFilters" class="brand-filter-list"></div>
        </div>
        <section id="tournaments" class="archive-list"></section>
    </main>

    <div id="detailModal" class="modal" hidden>
        <div class="modal-backdrop" onclick="closeDetailModal()"></div>
        <section class="modal-panel">
            <button class="modal-close" onclick="closeDetailModal()">×</button>
            <div id="detailModalBody"></div>
        </section>
    </div>

    <footer class="site-footer">
        <div class="icp-info">
            {{BEIAN}}
        </div>
    </footer>

    <script src="/js/tournament-logos.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/h2h.js"></script>
    <script src="/js/bracket.js"></script>
    <script src="/js/tournaments.js"></script>
</body>
</html>
